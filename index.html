<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      try {
        if (typeof window !== 'undefined' && window.fetch) {
          const originalFetch = window.fetch.bind(window);
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: () => currentFetch,
            set: (fn) => { currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Fetch patch error:', e);
      }
    </script>
    <title>LootBar Admin Dashboard & Telegram Bot</title>
    <meta name="description" content="An application built with Google AI Studio." />
    <meta property="og:title" content="My Google AI Studio App" />
    <meta property="og:description" content="An application built with Google AI Studio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main_v2.tsx"></script>
  </body>
</html>
